<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1次元セルオートマトン Rule 110</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0d0d0d; }
  canvas { image-rendering: pixelated; }
  input[type=range] { accent-color: #818cf8; }
  .rule-bit { width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 10px; font-weight: bold; }
</style>
</head>
<body class="min-h-screen text-white flex flex-col items-center py-6 px-4">
  <h1 class="text-2xl font-bold mb-1 text-indigo-400">1次元セルオートマトン ルール可視化</h1>
  <p class="text-sm text-gray-400 mb-4">Wolfram 1次元CA（Rule 0–255）の時間発展 ｜ Rule 110はチューリング完全</p>

  <div class="flex flex-col lg:flex-row gap-6 items-start justify-center w-full max-w-5xl">
    <div class="flex flex-col items-center gap-3">
      <canvas id="canvas" width="600" height="400" class="border border-gray-700 rounded-lg shadow-lg"></canvas>
      <div class="flex gap-3 flex-wrap justify-center">
        <button id="btnRun" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold transition-colors">実行</button>
        <button id="btnStep" class="px-5 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg font-semibold transition-colors">1世代進む</button>
        <button id="btnReset" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-semibold transition-colors">リセット</button>
        <button id="btnPreset110" class="px-4 py-2 bg-indigo-800 hover:bg-indigo-700 rounded-lg text-sm font-semibold transition-colors border border-indigo-500">Rule 110</button>
        <button id="btnPreset30" class="px-4 py-2 bg-purple-800 hover:bg-purple-700 rounded-lg text-sm font-semibold transition-colors border border-purple-500">Rule 30</button>
      </div>
      <div class="text-sm text-gray-400">世代数: <span id="genCount" class="text-indigo-300 font-mono">0</span> / <span id="maxGen" class="text-gray-500 font-mono">200</span></div>
    </div>

    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 w-full max-w-sm">
      <h2 class="text-lg font-semibold text-indigo-300 mb-4">パラメータ</h2>

      <div class="space-y-5">
        <div>
          <label class="text-sm text-gray-300 flex justify-between mb-1">
            <span>ルール番号</span>
            <span id="valRule" class="text-indigo-400 font-mono text-lg font-bold">110</span>
          </label>
          <input type="range" id="sliderRule" min="0" max="255" value="110" class="w-full">
          <div class="flex justify-between text-xs text-gray-600 mt-1"><span>0</span><span>255</span></div>
        </div>

        <div>
          <label class="text-sm text-gray-300 mb-2 block">初期条件</label>
          <div class="flex gap-2">
            <button id="initCenter" class="flex-1 py-2 bg-indigo-700 hover:bg-indigo-600 rounded text-sm transition-colors" data-active="true">中央1セル</button>
            <button id="initRandom" class="flex-1 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition-colors" data-active="false">ランダム</button>
          </div>
        </div>

        <div>
          <label class="text-sm text-gray-300 flex justify-between mb-1">
            <span>セルサイズ（px）</span>
            <span id="valCellSize" class="text-indigo-400 font-mono">2</span>
          </label>
          <input type="range" id="sliderCellSize" min="1" max="4" value="2" class="w-full">
        </div>
      </div>

      <div class="mt-5 border-t border-gray-700 pt-4">
        <h3 class="text-sm font-semibold text-gray-400 mb-3">ルール遷移表（現在のルール）</h3>
        <div id="ruleDisplay" class="grid grid-cols-8 gap-1"></div>
      </div>

      <div class="mt-4 border-t border-gray-700 pt-4 text-xs text-gray-500 space-y-1">
        <p><span class="text-indigo-400 font-semibold">Rule 110:</span> チューリング完全。複雑な自己組織化構造を生成。</p>
        <p><span class="text-purple-400 font-semibold">Rule 30:</span> カオス的。乱数生成にも使われる。</p>
        <p><span class="text-gray-400 font-semibold">Rule 90:</span> シェルピンスキー三角形。</p>
      </div>
    </div>
  </div>

<script>
const CANVAS_W = 600;
const CANVAS_H = 400;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let rule = 110;
let cellSize = 2;
let initMode = 'center';
let generation = 0;
let running = false;
let animHandle = null;

const cols = () => Math.floor(CANVAS_W / cellSize);
const rows = () => Math.floor(CANVAS_H / cellSize);

let grid = []; // grid[gen][col]

function getRuleOutput(left, center, right) {
  const idx = (left << 2) | (center << 1) | right;
  return (rule >> idx) & 1;
}

function initGridData() {
  grid = [];
  const c = cols();
  const firstRow = new Uint8Array(c);
  if (initMode === 'center') {
    firstRow[Math.floor(c / 2)] = 1;
  } else {
    for (let i = 0; i < c; i++) firstRow[i] = Math.random() < 0.5 ? 1 : 0;
  }
  grid.push(firstRow);
  generation = 1;
}

function stepGrid() {
  if (grid.length >= rows()) return false;
  const prev = grid[grid.length - 1];
  const c = prev.length;
  const next = new Uint8Array(c);
  for (let i = 0; i < c; i++) {
    const l = prev[(i - 1 + c) % c];
    const ce = prev[i];
    const r = prev[(i + 1) % c];
    next[i] = getRuleOutput(l, ce, r);
  }
  grid.push(next);
  generation = grid.length;
  return true;
}

function renderAll() {
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  for (let g = 0; g < grid.length; g++) {
    const row = grid[g];
    for (let c = 0; c < row.length; c++) {
      if (row[c]) {
        ctx.fillStyle = rule === 110 ? '#a5b4fc' : rule === 30 ? '#d8b4fe' : '#f0f0f0';
        ctx.fillRect(c * cellSize, g * cellSize, cellSize, cellSize);
      }
    }
  }
  document.getElementById('genCount').textContent = generation;
  document.getElementById('maxGen').textContent = rows();
}

function runAll() {
  while (grid.length < rows()) stepGrid();
  renderAll();
}

function animLoop() {
  if (grid.length < rows()) {
    stepGrid();
    renderAll();
    animHandle = requestAnimationFrame(animLoop);
  } else {
    running = false;
  }
}

document.getElementById('btnRun').addEventListener('click', () => {
  if (!running) {
    running = true;
    animLoop();
  }
});

document.getElementById('btnStep').addEventListener('click', () => {
  stepGrid();
  renderAll();
});

document.getElementById('btnReset').addEventListener('click', () => {
  running = false;
  cancelAnimationFrame(animHandle);
  initGridData();
  renderAll();
});

document.getElementById('btnPreset110').addEventListener('click', () => {
  rule = 110;
  document.getElementById('sliderRule').value = 110;
  document.getElementById('valRule').textContent = 110;
  updateRuleDisplay();
  resetAndRun();
});

document.getElementById('btnPreset30').addEventListener('click', () => {
  rule = 30;
  document.getElementById('sliderRule').value = 30;
  document.getElementById('valRule').textContent = 30;
  updateRuleDisplay();
  resetAndRun();
});

function resetAndRun() {
  running = false;
  cancelAnimationFrame(animHandle);
  initGridData();
  runAll();
}

document.getElementById('sliderRule').addEventListener('input', e => {
  rule = parseInt(e.target.value);
  document.getElementById('valRule').textContent = rule;
  updateRuleDisplay();
  resetAndRun();
});

document.getElementById('sliderCellSize').addEventListener('input', e => {
  cellSize = parseInt(e.target.value);
  document.getElementById('valCellSize').textContent = cellSize;
  resetAndRun();
});

document.getElementById('initCenter').addEventListener('click', () => {
  initMode = 'center';
  document.getElementById('initCenter').classList.replace('bg-gray-700','bg-indigo-700');
  document.getElementById('initRandom').classList.replace('bg-indigo-700','bg-gray-700');
  resetAndRun();
});

document.getElementById('initRandom').addEventListener('click', () => {
  initMode = 'random';
  document.getElementById('initRandom').classList.replace('bg-gray-700','bg-indigo-700');
  document.getElementById('initCenter').classList.replace('bg-indigo-700','bg-gray-700');
  resetAndRun();
});

function updateRuleDisplay() {
  const container = document.getElementById('ruleDisplay');
  container.innerHTML = '';
  const patterns = ['111','110','101','100','011','010','001','000'];
  for (let i = 7; i >= 0; i--) {
    const output = (rule >> i) & 1;
    const col = document.createElement('div');
    col.className = 'flex flex-col items-center gap-1';
    const pLabel = document.createElement('div');
    pLabel.className = 'text-xs text-gray-500';
    pLabel.textContent = patterns[7 - i];
    const oCell = document.createElement('div');
    oCell.className = `rule-bit text-xs font-bold ${output ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-500 border border-gray-600'}`;
    oCell.textContent = output;
    col.appendChild(pLabel);
    col.appendChild(oCell);
    container.appendChild(col);
  }
}

updateRuleDisplay();
initGridData();
runAll();
</script>
</body>
</html>
